name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:

  build:

    runs-on: seld-hosted

    steps:
    - name: Pull Docker image
      run: sudo docker pull aqssajavaid/cicd-pipeline:latest
    - name: Delete Old docker container  
      run: sudo docker rm -f cicd-pipeline-container || true
    - name: Run Docker Container
      run: sudo docker run -d -p 8080:8080 --name cicd-pipeline-container aqssajavaid/cicd-pipeline   
  
    
